name: Publish gaming news to Telegram

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview without publishing"
        required: false
        default: true
        type: boolean
  repository_dispatch:
    types:
      - publish_gaming_news
  push:
    branches:
      - main
    paths:
      - "data/run-now.txt"

permissions:
  contents: write

concurrency:
  group: gaming-news-publisher
  cancel-in-progress: false

jobs:
  publish:
    # cron-job.org still dispatches every 5 minutes, but the cadence gate below
    # allows only every second dispatch to perform a news search (10 minutes).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'repository_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
      TELEGRAM_PUBLIC_USERNAME: ${{ vars.TELEGRAM_PUBLIC_USERNAME }}
      TELEGRAM_FUNNEL_URL: ${{ vars.TELEGRAM_FUNNEL_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
      GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
      GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
      GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
      GEMINI_MODEL: "gemini-3.5-flash-lite"
      GEMINI_FALLBACK_MODEL: "gemini-3.1-flash-lite"
      MAX_AGE_HOURS: "72"
      MAX_POSTS_PER_RUN: "1"
      MIN_IMPORTANCE_SCORE: "5"
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false && 'false' || github.event_name == 'push' && 'true' || 'false' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce 10-minute search cadence
        id: cadence
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "repository_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual/push run: cadence gate bypassed"
            exit 0
          fi

          slot=$(( $(date -u +%s) / 300 ))
          if [ $((slot % 2)) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "10-minute cadence: this dispatch will search for news"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "10-minute cadence: skipping this 5-minute dispatch"
          fi

      # repository_dispatch runs keep the commit SHA from the moment they were
      # queued. Always move to the current main before reading posted.json so a
      # delayed run cannot publish from stale history.
      - name: Refresh latest main and publication history
        if: steps.cadence.outputs.run == 'true'
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          echo "Using latest main: $(git rev-parse HEAD)"

      - name: Set up Python
        if: steps.cadence.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.cadence.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Collect and publish gaming news
        if: steps.cadence.outputs.run == 'true'
        run: |
          if [ "$DRY_RUN" = "true" ] && \
             [ -z "$GEMINI_API_KEY" ] && [ -z "$GEMINI_API_KEY_2" ] && \
             [ -z "$GEMINI_API_KEY_3" ] && [ -z "$GEMINI_API_KEY_4" ] && \
             [ -z "$GEMINI_API_KEY_5" ] && [ -z "$GEMINI_API_KEY_6" ] && \
             [ -z "$GEMINI_API_KEY_7" ] && [ -z "$GEMINI_API_KEY_8" ]; then
            echo "Gemini keys are not configured; running secret-free collector smoke test"
            python smoke_test.py
          else
            python direct_publisher.py
          fi

      - name: Save publication history safely
        if: ${{ steps.cadence.outputs.run == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
        run: |
          if git diff --quiet -- data/posted.json; then
            echo "No history changes"
            exit 0
          fi

          cp data/posted.json /tmp/local-posted.json
          git restore data/posted.json
          git pull --rebase origin main
          python merge_state.py data/posted.json /tmp/local-posted.json data/posted.json

          if git diff --quiet -- data/posted.json; then
            echo "History already contains these publications"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posted.json
          git commit -m "Update gaming publication history"

          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "Publication history pushed on attempt $attempt"
              exit 0
            fi
            echo "Publication history push failed on attempt $attempt; retrying"
            sleep $((attempt * 3))
          done

          echo "Publication history push failed after 4 attempts"
          exit 1
